<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="A trip prompt being typed and parsed">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .typed { clip-path: inset(0 100% 0 0); animation: type 4.2s steps(66) .4s infinite; }
      @keyframes type { 0% { clip-path: inset(0 100% 0 0); } 45%, 100% { clip-path: inset(0 0 0 0); } }
      .caret { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .chip { opacity: 0; animation: pop 4.2s infinite; }
      @keyframes pop { 0%, 48% { opacity: 0; transform: translateY(8px); } 58%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .75s; } .c5 { animation-delay: 1s; }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="149" fill="#fff" stroke="#d3e0ec"/>
  <text x="28" y="30" font-size="11" letter-spacing="1.2" fill="#6b7f95">DESCRIBE YOUR TRIP ONCE</text>
  <g class="typed"><text x="28" y="66" font-size="24" fill="#0a1424">5 relaxed days in Lisbon with my partner — food, tiles and sunsets</text></g>
  <rect x="1134" y="42" width="38" height="34" fill="#001489"/><path d="M1145 59 h16 m-6 -6 l6 6 -6 6" stroke="#fff" stroke-width="2" fill="none"/>
  <line x1="28" y1="82" x2="1120" y2="82" stroke="#0a1424" stroke-width="1.5"/>
  <g class="chip"><rect x="28" y="96" width="160" height="38" fill="#eaf2fa" stroke="#d3e0ec"/><text x="40" y="112" font-size="9" fill="#6b7f95">DESTINATION</text><text x="40" y="127" font-size="13" font-weight="600" fill="#001489">Lisbon, Portugal</text></g>
  <g class="chip c2"><rect x="196" y="96" width="150" height="38" fill="#eaf2fa" stroke="#d3e0ec"/><text x="208" y="112" font-size="9" fill="#6b7f95">LENGTH</text><text x="208" y="127" font-size="13" font-weight="600" fill="#001489">5 days · 4 nights</text></g>
  <g class="chip c3"><rect x="354" y="96" width="120" height="38" fill="#eaf2fa" stroke="#d3e0ec"/><text x="366" y="112" font-size="9" fill="#6b7f95">PARTY</text><text x="366" y="127" font-size="13" font-weight="600" fill="#001489">2 travellers</text></g>
  <g class="chip c4"><rect x="482" y="96" width="100" height="38" fill="#eaf2fa" stroke="#d3e0ec"/><text x="494" y="112" font-size="9" fill="#6b7f95">PACE</text><text x="494" y="127" font-size="13" font-weight="600" fill="#001489">Relaxed</text></g>
  <g class="chip c5"><rect x="590" y="96" width="190" height="38" fill="#eaf2fa" stroke="#d3e0ec"/><text x="602" y="112" font-size="9" fill="#6b7f95">INTO</text><text x="602" y="127" font-size="13" font-weight="600" fill="#001489">Food · Tiles · Sunsets</text></g>
  <g class="chip c5"><text x="800" y="121" font-size="13" fill="#0a1424">→  architecting 5 days · weather-aware · bookable in one tap</text></g>
</svg>
